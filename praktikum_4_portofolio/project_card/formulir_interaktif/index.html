<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Interaktif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="main-section">
        <div class="container">
            
            <div class="header-title">
                <h1>Form Pendaftaran Anggota</h1>
                <p>Silakan lengkapi data diri Anda pada formulir interaktif di bawah ini.</p>
            </div>

            <div class="form-card">
                <form id="form-pendaftaran" method="POST">
                    <fieldset>
                        <legend>Data Pendaftar</legend>

                        <div class="form-group">
                            <label for="nama">Nama Lengkap</label>
                            <input type="text" id="nama" placeholder="Contoh: Chattama Albiantoro">
                        </div>

                        <div class="form-group">
                            <label for="email">Alamat Email</label>
                            <input type="email" id="email" placeholder="nama@email.com">
                        </div>

                        <div class="form-group">
                            <label for="divisi">Pilihan Divisi</label>
                            <select id="divisi">
                                <option value="">-- Pilih Divisi --</option>
                                <option value="Web Development">Web Development</option>
                                <option value="UI/UX Design">UI/UX Design</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="password">Kata Sandi Akun</label>
                            <input type="password" id="password" placeholder="Minimal 6 karakter">
                            <span id="info-sandi" class="helper-text">Jumlah karakter: 0</span>
                        </div>

                        <p id="pesan-validasi"></p>

                        <button type="submit" class="btn">Daftar Sekarang</button>
                    </fieldset>
                </form>
            </div>

            <div class="result-section">
                <h2>Daftar Peserta Terdaftar</h2>
                <div class="member-grid" id="member-grid">
                </div>
            </div>

        </div>
    </section>

    <script src="main.js"></script>
</body>
</html>
