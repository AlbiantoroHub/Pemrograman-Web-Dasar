<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak | Chattama Albiantoro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigasi -->
    <nav>
        <div class="container">
            <div class="logo">Chattama.</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="page-section">
        <div class="container">
            <h2>Hubungi Saya</h2>
            
            <div class="form-wrapper">
                <form id="contact-form" method="POST">
                    <fieldset class="form-fieldset">
                        <legend class="form-legend">Kirim Pesan atau Diskusi</legend>
                        
                        <div class="form-group">
                            <label for="nama">Nama Lengkap</label>
                            <input type="text" id="nama" placeholder="Masukkan nama Anda">
                        </div>

                        <div class="form-group">
                            <label for="email">Alamat Email</label>
                            <input type="email" id="email" placeholder="contoh@email.com">
                        </div>

                        <div class="form-group">
                            <label for="pesan">Pesan</label>
                            <textarea id="pesan" rows="5" placeholder="Tuliskan pesan Anda di sini..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-full">Kirim Pesan</button>
                    </fieldset>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Chattama Albiantoro | <a href="https://github.com/AlbiantoroHub" target="_blank">GitHub Saya</a></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
