<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2: Deret Bilangan Ganjil</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f2f5; 
            padding: 40px; 
            display: flex;
            justify-content: center;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            width: 100%;
            max-width: 400px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { 
            padding: 12px; 
            width: 90%; 
            margin-bottom: 15px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 16px; 
            text-align: center; 
        }
        button { 
            padding: 12px; 
            background: #2ecc71;
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            width: 100%; 
            transition: background 0.3s; 
        }
        button:hover { background: #27ae60; }
        .hasil { 
            margin-top: 20px; 
            padding: 15px; 
            background: #eaf2f8; 
            border-radius: 6px; 
            font-size: 16px; 
            color: #2c3e50; 
            text-align: left; 
            line-height: 1.6;
            word-wrap: break-word; 
        }
        .pesan-error { color: #e74c3c; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔢 Deret Bilangan Ganjil</h2>
        
        <input type="number" id="inputN" placeholder="Masukkan nilai N">
        
        <button onclick="tampilGanjil()">Tampilkan</button>
        
        <div class="hasil" id="tempatHasil">
            Deret akan muncul di sini. 😁
        </div>
    </div>

    <script>
        function tampilGanjil() {
            let n = parseInt(document.getElementById("inputN").value);
            let tempatHasil = document.getElementById("tempatHasil");

            if (isNaN(n) || n < 1) {
                tempatHasil.innerHTML = '<div class="pesan-error">⚠️ Masukkan angka positif!</div>';
                return; 
            }

            let deretHasil = ""; 

            for (let i = 1; i <= n; i++) {
                if (i % 2 !== 0) {
                    deretHasil += i + ", "; 
                }
            }

            if (deretHasil.length > 0) {
                deretHasil = deretHasil.slice(0, -2);
            }

            tempatHasil.innerHTML = 
                "<strong>Batas N:</strong> " + n + "<br><hr>" +
                "<strong>Deret Ganjil:</strong><br>" + deretHasil;
        }
    </script>

</body>
</html>
